<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO MEJORADO -->
  <meta name="description" content="Submit your product review by selecting a product, rating your experience, and sharing feedback to help others make informed decisions.">
  <meta name="author" content="Alan Hernandez">

  <title>Product Review Form | Submit Your Feedback</title>

  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>

<body>
  <header>
    <h1>Product Review Form</h1>
    <p>Share your experience and help others choose better.</p>
  </header>

  <main>
    <form method="get" action="review.html" class="review-form" aria-label="Product Review Form">

      <!-- PRODUCT -->
      <div class="form-group">
        <label for="productName">Product Name</label>
        <select id="productName" name="productName" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
      </div>

      <!-- RATING -->
      <fieldset class="form-group">
        <legend>Overall Rating</legend>

        <div class="rating-group">
          <label for="rating1">
            <input type="radio" id="rating1" name="rating" value="1" required>
            ☆ (1)
          </label>

          <label for="rating2">
            <input type="radio" id="rating2" name="rating" value="2">
            ☆☆ (2)
          </label>

          <label for="rating3">
            <input type="radio" id="rating3" name="rating" value="3">
            ☆☆☆ (3)
          </label>

          <label for="rating4">
            <input type="radio" id="rating4" name="rating" value="4">
            ☆☆☆☆ (4)
          </label>

          <label for="rating5">
            <input type="radio" id="rating5" name="rating" value="5">
            ☆☆☆☆☆ (5)
          </label>
        </div>
      </fieldset>

      <!-- DATE -->
      <div class="form-group">
        <label for="installDate">Date of Installation</label>
        <input type="date" id="installDate" name="installDate" required>
      </div>

      <!-- FEATURES -->
      <fieldset class="form-group">
        <legend>Useful Features (Check all that apply)</legend>

        <label>
          <input type="checkbox" name="features" value="Durability">
          Durability
        </label>

        <label>
          <input type="checkbox" name="features" value="Ease of Use">
          Ease of Use
        </label>

        <label>
          <input type="checkbox" name="features" value="Performance">
          Performance
        </label>

        <label>
          <input type="checkbox" name="features" value="Design">
          Design
        </label>
      </fieldset>

      <!-- REVIEW -->
      <div class="form-group">
        <label for="writtenReview">Written Review (Optional)</label>
        <textarea id="writtenReview" name="writtenReview" rows="5" placeholder="Write your experience..."></textarea>
      </div>

      <!-- NAME -->
      <div class="form-group">
        <label for="userName">User Name (Optional)</label>
        <input type="text" id="userName" name="userName" placeholder="Your name">
      </div>

      <!-- SUBMIT -->
      <div class="form-group">
        <input type="submit" value="Submit Review" class="submit-btn">
      </div>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 | Alan Hernandez | Mexico</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
