<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Submit your product review by selecting a product, rating your experience, and sharing feedback to help others make informed decisions.">
  <meta name="author" content="Alan Hernandez">
  <title>Product Review Form | Submit Your Feedback</title>
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review Form</h1>
    <p>Share your experience and help others choose better.</p>
  </header>

  <main>
    <form method="get" action="review.html" class="review-form">

      <div class="form-group">
        <label for="productName">Product Name</label>
        <select id="productName" name="productName" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
      </div>

      <fieldset class="form-group">
        <legend>Overall Rating</legend>

        <div class="rating-group">
          <input type="radio" id="rating1" name="rating" value="1" required>
          <label for="rating1">☆ (1)</label>

          <input type="radio" id="rating2" name="rating" value="2" required>
          <label for="rating2">☆☆ (2)</label>

          <input type="radio" id="rating3" name="rating" value="3" required>
          <label for="rating3">☆☆☆ (3)</label>

          <input type="radio" id="rating4" name="rating" value="4" required>
          <label for="rating4">☆☆☆☆ (4)</label>

          <input type="radio" id="rating5" name="rating" value="5" required>
          <label for="rating5">☆☆☆☆☆ (5)</label>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="installDate">Date of Installation</label>
        <input type="date" id="installDate" name="installDate" required>
      </div>

      <fieldset class="form-group">
        <legend>Useful Features (Check all that apply)</legend>

        <div class="checkbox-group">
          <input type="checkbox" id="durability" name="features" value="Durability">
          <label for="durability">Durability</label>

          <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
          <label for="easeOfUse">Ease of Use</label>

          <input type="checkbox" id="performance" name="features" value="Performance">
          <label for="performance">Performance</label>

          <input type="checkbox" id="design" name="features" value="Design">
          <label for="design">Design</label>
        </div>
      </fieldset>

      <div class="form-group">
        <label for="writtenReview">Written Review</label>
        <textarea id="writtenReview" name="writtenReview" rows="5" placeholder="Write your experience here..."></textarea>
      </div>

      <div class="form-group">
        <label for="userName">User Name</label>
        <input type="text" id="userName" name="userName" placeholder="Your name">
      </div>

      <div class="form-group">
        <input type="submit" value="Submit Review" class="submit-btn">
      </div>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 | Alan Hernandez | Mexico</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
